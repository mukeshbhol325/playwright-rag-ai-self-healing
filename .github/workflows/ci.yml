name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # nightly run against the live demo store

jobs:
  healer-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: healer-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: healer-service/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest

  typecheck-and-offline-healing:
    runs-on: ubuntu-latest
    needs: healer-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tests-ts/package-lock.json }
      - name: Start healer service
        working-directory: healer-service
        run: |
          pip install -r requirements.txt
          KB_DIR=/tmp/kb LLM_PROVIDER=none nohup python -m uvicorn app.main:app --port 8000 > /tmp/healer.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
      - name: Typecheck and run offline healing tests (no internet needed)
        working-directory: tests-ts
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
          npm run test:offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-reports
          path: tests-ts/reports

  live-e2e:
    # Hits the shared public demo store, so only on manual or nightly runs.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: typecheck-and-offline-healing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tests-ts/package-lock.json }
      - name: Start healer service
        working-directory: healer-service
        run: |
          pip install -r requirements.txt
          KB_DIR=/tmp/kb LLM_PROVIDER=none nohup python -m uvicorn app.main:app --port 8000 > /tmp/healer.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
      - name: Smoke, e2e and healing tests against demo.opencart.com
        working-directory: tests-ts
        env:
          CI: "true"
          MAX_HEALS: "0"   # real regressions must not hide behind healing; only the @healing spec may heal
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:smoke
          npm run test:e2e
          MAX_HEALS=-1 npm run test:healing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-reports
          path: |
            tests-ts/reports
            tests-ts/test-results
