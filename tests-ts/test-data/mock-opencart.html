<!doctype html>
<html lang="en-gb">
<head><title>Mock OpenCart storefront</title></head>
<body>
<!-- Offline stand-in for OpenCart 4.x markup, used by tests/integration to verify healing without the public demo. -->
<header>
  <div id="search" class="input-group">
    <input type="text" name="search" value="" placeholder="Search" class="form-control form-control-lg">
    <button type="button" class="btn btn-light btn-lg"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>
  <a href="#" title="Shopping Cart">Shopping Cart</a>
  <a href="#" title="Checkout">Checkout</a>
  <div id="header-cart" class="dropdown"><button type="button" class="btn btn-lg">0 item(s)</button></div>
</header>
<div id="alert" class="toast-container"></div>
<div id="content">
  <h1>Phones &amp; PDAs</h1>
  <div id="product-list" class="row">
    <div class="col"><form><div class="product-thumb">
      <div class="description"><h4><a href="#">HTC Touch HD</a></h4></div>
      <div class="button-group">
        <button type="button" formaction="/index.php?route=checkout/cart.add" title="Add to Cart" onclick="added('HTC Touch HD')"><i class="fa-solid fa-shopping-cart"></i></button>
        <button type="button" formaction="/index.php?route=account/wishlist.add" title="Add to Wish List"><i class="fa-solid fa-heart"></i></button>
      </div></div></form></div>
    <div class="col"><form><div class="product-thumb">
      <div class="description"><h4><a href="#">iPhone</a></h4></div>
      <div class="button-group">
        <button type="button" formaction="/index.php?route=checkout/cart.add" title="Add to Cart" onclick="added('iPhone')"><i class="fa-solid fa-shopping-cart"></i></button>
        <button type="button" formaction="/index.php?route=account/wishlist.add" title="Add to Wish List"><i class="fa-solid fa-heart"></i></button>
      </div></div></form></div>
  </div>

  <form id="form-register">
    <input type="text" name="firstname" value="" placeholder="First Name" id="input-firstname" class="form-control">
    <input type="text" name="lastname" value="" placeholder="Last Name" id="input-lastname" class="form-control">
    <input type="email" name="email" value="" placeholder="E-Mail" id="input-email" class="form-control">
    <input type="text" name="shipping_address_1" value="" placeholder="Address 1" id="input-shipping-address-1" class="form-control">
    <input type="text" name="shipping_address_2" value="" placeholder="Address 2" id="input-shipping-address-2" class="form-control">
    <input type="text" name="shipping_city" value="" placeholder="City" id="input-shipping-city" class="form-control">
    <button type="button" id="button-register" class="btn btn-primary" onclick="document.getElementById('saved').hidden=false">Continue</button>
  </form>
  <p id="saved" hidden>Details saved</p>

  <button type="button" id="button-confirm" class="btn btn-primary" onclick="document.getElementById('done').hidden=false">Confirm Order</button>
  <h2 id="done" hidden>Your order has been placed!</h2>
</div>
<script>
  function added(name) {
    document.getElementById('alert').innerHTML =
      '<div class="alert alert-success">Success: You have added <a href="#">' + name + '</a> to your <a href="#">shopping cart</a>!</div>';
  }
</script>
</body>
</html>
